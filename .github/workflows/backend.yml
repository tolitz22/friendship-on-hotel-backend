name: Laravel backend validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, openssl, fileinfo, dom, xml, curl, zip
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint PHP sources
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify route registration
        run: php artisan route:list --path=api
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
      - name: Feature tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: friendship_on_hotel_test
          POSTGRES_USER: hotel_test
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_test -d friendship_on_hotel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: friendship_on_hotel_test
      DB_USERNAME: hotel_test
      DB_PASSWORD: local_ci_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, openssl, fileinfo, dom, xml, curl, zip
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: PostgreSQL reservation integrity tests
        run: php artisan test tests/Feature/ReservationSchemaTest.php

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: friendship_on_hotel_test
          MYSQL_USER: hotel_test
          MYSQL_PASSWORD: ci_only_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci_only_root_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: friendship_on_hotel_test
      DB_USERNAME: hotel_test
      DB_PASSWORD: ci_only_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, mysqli, intl, openssl, fileinfo, dom, xml, curl, zip
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: MySQL migrations and feature tests
        run: php artisan test
