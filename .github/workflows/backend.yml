name: Laravel backend validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local-only Laravel environment file
        run: cp .env.example .env
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, openssl, fileinfo, dom, xml, curl, zip
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify Laravel test mocking dependency
        run: php -r "require 'vendor/autoload.php'; if (!class_exists('Mockery')) { fwrite(STDERR, 'Mockery is missing'.PHP_EOL); exit(1); }"
      - name: Lint PHP sources
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify route registration
        run: php artisan route:list --path=api
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
      - name: Phase 43 persisted guest-to-checkout acceptance
        run: php artisan test tests/Feature/Phase43RealWorkflowAcceptanceTest.php
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
      - name: Phase 62.5 critical guest operations acceptance
        run: |
          php artisan test \
            tests/Feature/Phase625OperationalBoundaryTest.php \
            tests/Feature/Phase43RealWorkflowAcceptanceTest.php \
            tests/Feature/CashierShiftPhase52Test.php \
            tests/Feature/RoomReadinessPhase35Test.php \
            tests/Feature/OccupancyVerificationPhase53Test.php \
            tests/Feature/OccupancyCoverageReportPhase55Test.php \
            tests/Feature/FinancialBusinessDayIntegrationTest.php \
            tests/Feature/NightAuditFinancialReportTest.php
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
      - name: Feature tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          FINANCE_ENABLE_VERIFIED_SETTLEMENT: 'false'
      - name: Settlement-enabled integration suite (SQLite)
        run: php artisan test tests/Feature/FolioSettlementIntegrationTest.php
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          FINANCE_ENABLE_VERIFIED_SETTLEMENT: 'true'

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: friendship_on_hotel_test
          POSTGRES_USER: hotel_test
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_test -d friendship_on_hotel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: friendship_on_hotel_test
      DB_USERNAME: hotel_test
      DB_PASSWORD: local_ci_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local-only Laravel environment file
        run: cp .env.example .env
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, openssl, fileinfo, dom, xml, curl, zip
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify Laravel test mocking dependency
        run: php -r "require 'vendor/autoload.php'; if (!class_exists('Mockery')) { fwrite(STDERR, 'Mockery is missing'.PHP_EOL); exit(1); }"
      - name: PostgreSQL full suite with isolated disposable database per test file
        run: bash scripts/run-isolated-db-tests.sh
        env:
          FINANCE_ENABLE_VERIFIED_SETTLEMENT: 'false'
      - name: PostgreSQL settlement-enabled integration
        run: |
          php artisan db:wipe --force --no-interaction --quiet
          php artisan test tests/Feature/FolioSettlementIntegrationTest.php --no-ansi
        env:
          FINANCE_ENABLE_VERIFIED_SETTLEMENT: 'true'
      - name: PostgreSQL booking and multi-room group races
        run: |
          php artisan db:wipe --force --no-interaction --quiet
          php artisan migrate --force --no-interaction
          php scripts/real-engine-booking-race.php
          php scripts/real-engine-group-race.php
          php scripts/real-engine-supplier-payment-race.php
          php scripts/real-engine-reimbursement-race.php
          php scripts/real-engine-no-show-race.php
          php scripts/real-engine-no-show-allocation-race.php competing
          php scripts/real-engine-no-show-allocation-race.php duplicate
        env:
          FINANCE_ENABLE_VERIFIED_SETTLEMENT: 'false'

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: friendship_on_hotel_test
          MYSQL_USER: hotel_test
          MYSQL_PASSWORD: ci_only_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci_only_root_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: friendship_on_hotel_test
      DB_USERNAME: hotel_test
      DB_PASSWORD: ci_only_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local-only Laravel environment file
        run: cp .env.example .env
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, mysqli, intl, openssl, fileinfo, dom, xml, curl, zip
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify Laravel test mocking dependency
        run: php -r "require 'vendor/autoload.php'; if (!class_exists('Mockery')) { fwrite(STDERR, 'Mockery is missing'.PHP_EOL); exit(1); }"
      - name: MySQL full suite with isolated disposable database per test file
        run: bash scripts/run-isolated-db-tests.sh
        env:
          FINANCE_ENABLE_VERIFIED_SETTLEMENT: 'false'
      - name: MySQL settlement-enabled integration
        run: |
          php artisan db:wipe --force --no-interaction --quiet
          php artisan test tests/Feature/FolioSettlementIntegrationTest.php --no-ansi
        env:
          FINANCE_ENABLE_VERIFIED_SETTLEMENT: 'true'
      - name: MySQL 8.4 booking and multi-room group races
        run: |
          php artisan db:wipe --force --no-interaction --quiet
          php artisan migrate --force --no-interaction
          php scripts/real-engine-booking-race.php
          php scripts/real-engine-group-race.php
          php scripts/real-engine-supplier-payment-race.php
          php scripts/real-engine-reimbursement-race.php
          php scripts/real-engine-no-show-race.php
          php scripts/real-engine-no-show-allocation-race.php competing
          php scripts/real-engine-no-show-allocation-race.php duplicate
        env:
          FINANCE_ENABLE_VERIFIED_SETTLEMENT: 'false'
