name: Laravel backend validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, openssl, fileinfo, dom, xml, curl, zip
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint PHP sources
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify route registration
        run: php artisan route:list --path=api
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
      - name: Feature tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
